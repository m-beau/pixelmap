[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelmap"
dynamic = ["version"]
description = "Browser-based Neuropixels channelmap generator."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ['LICENSE.txt']
authors = [
    {name = "Maxime Beau", email = "maxime@princeton.edu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "panel>=1.3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "param>=1.13.0",
    "bokeh>=3.0.0",
    "dotenv>=0.9.9",
    "psutil>=7.1.0",
    "brainglobe-atlasapi>=2.0",
]

[project.gui-scripts]
pixelmap = "pixelmap.gui.app_util:main"

[project.urls]
Homepage = "https://github.com/m-beau/pixelmap"
Documentation = "https://pixelmap-neuropixels.readthedocs.io"
Repository = "https://github.com/m-beau/pixelmap"
Issues = "https://github.com/m-beau/pixelmap/issues"

[tool.setuptools.dynamic]
version = {attr = "pixelmap.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["pixelmap*"]

[tool.setuptools.package-data]
pixelmap = [
    "wiring_maps/*.csv",
    "wiring_maps/*.json",
    "wiring_maps/*.pkl",
    "gui/*/*.png",
    "gui/*/*.svg",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser",
    "sphinx-design",
]

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "myst-parser>=4.0.1",
    "pytest>=8.4.1",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-design>=0.6.1",
]
