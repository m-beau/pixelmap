name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Every merge to main publishes `latest` + `main-<sha>`
      - dev   # Every commit/merge on dev publishes `dev` + `dev-<sha>`
    tags:
      - 'v*'  # Trigger on tags that start with 'v'
  release:
    types: [published]

# Serialise builds per ref so an older dev build can never finish last and
# overwrite a moving tag (`dev`/`latest`) with stale code. Superseded branch
# builds are cancelled; tag/release builds always run to completion.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        # Pre-releases (PEP 440 a/b/rc/dev, e.g. v1.4.1rc1) get only their
        # own tag, never `latest`: prod pulls `latest` via Watchtower, so an
        # RC must not roll out on its own. contains() is case-insensitive.
        # Merges to main also get `latest` (so they deploy via Watchtower)
        # plus an immutable `main-<short sha>` tag for pinning/rollback.
        # Pushes to dev get the moving `dev` tag plus `dev-<short sha>`, and
        # never `latest`.
        tags: |
          type=ref,event=tag
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev')) }}
          type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          type=sha,prefix=dev-,format=short,enable=${{ github.ref == 'refs/heads/dev' }}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image digest
      run: echo ${{ steps.build.outputs.digest }}

